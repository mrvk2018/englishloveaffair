<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta
      name="description"
      content="English Love Affair — английский в спокойной атмосфере. Пробный урок, расписание и личный кабинет ученика."
    />
    <title>English Love Affair</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect rx='8' width='32' height='32' fill='%23f43f5e'/%3E%3C/svg%3E" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Manrope", "sans-serif"],
              serif: ["Cormorant Garamond", "serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="bg-slate-50 font-sans text-slate-800 antialiased">
    <div id="app" class="mx-auto max-w-3xl px-4 py-16 text-center text-sm text-slate-400">Загрузка…</div>
    <div id="modal-root"></div>
    <div
      id="toast-root"
      class="pointer-events-none fixed inset-x-0 bottom-5 z-[70] mx-auto flex w-full max-w-lg flex-col items-stretch gap-2 px-4"
      role="status"
      aria-live="polite"
    ></div>
    <noscript>
      <p class="px-6 py-10 text-center text-slate-600">Для сайта нужен JavaScript.</p>
    </noscript>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
